<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>계정 잠금 해제</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript">
        $(document).ready(function() {
     // 인증번호 전송 버튼 클릭 이벤트
     $('#sendVerificationCode').click(function() {
         var username = $('#username').val();
         var phone = $('#phone').val();
         if (!phone) {
             alert("전화번호를 입력해주세요.");
             return;
         }
         if (!username) {
             alert("사용자 아이디를 입력해주세요.");
             return;
         }
         // 인증번호 전송 요청
         $.ajax({
             type: "POST",
             url: "/api/sms/send",
             contentType: "application/json",
             data: JSON.stringify({ "username": username, "phoneNumber": phone }),
             success: function(response) {
                 alert("인증번호가 발송되었습니다. 메시지를 확인해주세요.");
             },
             error: function() {
                 alert("인증번호 전송에 실패했습니다.");
             }
         });
     });
 });
    </script>
</head>
<body>
<h2>계정 잠금 해제</h2>
<form action="/guest/unlock" method="post">
    <label for="username">사용자 아이디:</label>
    <input type="text" id="username" name="username" required><br><br>

    <label for="phone">등록된 전화번호:</label>
    <input type="text" id="phone" name="phone" required><br><br>

    <button type="button" id="sendVerificationCode">인증번호 전송</button><br><br>

    <label for="verificationCode">인증번호:</label>
    <input type="text" id="verificationCode" name="verificationCode" required><br><br>

    <button type="submit">계정 잠금 해제</button>
</form>

<div th:if="${successMessage}" th:text="${successMessage}"></div>
<div th:if="${errorMessage}" th:text="${errorMessage}"></div>

<a href="/login">로그인 페이지로 돌아가기</a>
</body>
</html>
