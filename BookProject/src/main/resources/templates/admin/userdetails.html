<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 페이지 - 회원 상세 정보</title>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
</head>
<body>

<div class="col-8 pt-3 mt-3 mx-auto">
  <h4>관리자 페이지 - <small>회원 상세 정보</small></h4>

  <table class="table table-bordered table-hover table-striped">
    <tr>
      <th>아이디</th>
      <td th:text="${user.id}"></td>
    </tr>
    <tr>
      <th>닉네임</th>
      <td th:text="${user.nick}"></td>
    </tr>
    <tr>
      <th>이름</th>
      <td th:text="${user.name}"></td>
    </tr>
    <tr>
      <th>전화번호</th>
      <td th:text="${user.phone}"></td>
    </tr>
    <tr>
      <th>이메일</th>
      <td th:text="${user.email}"></td>
    </tr>
    <tr>
      <th>가입일</th>
      <td th:text="${#temporals.format(user.createDate, 'yyyy-MM-dd')}"></td>
    </tr>
    <tr>
      <th>권한</th>
      <td th:text="${user.authority}"></td>
    </tr>
    <tr>
      <th>계정 상태</th>
      <td th:text="${user.accountLocked == 1 ? '사용불가' : '사용가능'}"></td>
    </tr>
  </table>

  <div class="d-grid gap-2 d-md-flex justify-content-md-end">
    <form th:action="@{/admin/lockAccount}" method="post" th:if="${user.accountLocked == 0}">
      <input type="hidden" name="id" th:value="${user.id}"/>
      <button class="btn btn-danger" type="submit">계정 잠금</button>
    </form>

    <form th:action="@{/admin/unlockAccount}" method="post" th:if="${user.accountLocked == 1}">
      <input type="hidden" name="id" th:value="${user.id}"/>
      <button class="btn btn-success" type="submit">계정 잠금 해제</button>
    </form>

    <form th:action="@{/admin/deleteUser}" method="post">
      <input type="hidden" name="id" th:value="${user.id}"/>
      <button class="btn btn-warning" type="submit" onclick="return confirm('정말로 회원을 삭제하시겠습니까?');">회원 탈퇴</button>
    </form>

    <a th:href="@{/admin/list}" class="btn btn-primary">목록으로</a>
  </div>
</div>

</body>
</html>
